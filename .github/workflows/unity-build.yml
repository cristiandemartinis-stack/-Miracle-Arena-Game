name: Unity Production Validation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "unity/**"
      - ".github/workflows/unity-build.yml"

permissions:
  contents: read

jobs:
  production-preflight:
    name: Production asset preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Unity project and production assets
        shell: bash
        run: |
          set -euo pipefail
          test -f unity/ProjectSettings/ProjectVersion.txt
          grep -q '6000.2.6f2' unity/ProjectSettings/ProjectVersion.txt

          test -s unity/Assets/ProductionCharacters/Vitruvian/vitruvian_body.glb
          test -s unity/Assets/ProductionCharacters/Vitruvian/vitruvian_head.glb
          test -s unity/Assets/ProductionCharacters/Vitruvian/vitruvian_hair_rigged.glb
          test -s unity/Assets/ThirdParty/Quaternius/UniversalAnimationLibrary1/UAL1_Standard.fbx
          test -s unity/Assets/ThirdParty/Quaternius/UniversalAnimationLibrary2/UAL2_Standard.glb

          test -f unity/Assets/Editor/ProductionCharacterAssembler.cs
          test -f unity/Assets/Editor/FighterAnimatorBuilder.cs
          test -f unity/Assets/Editor/FighterAnimationQualityGate.cs
          test -f unity/Assets/Scripts/FighterAnimationContract.cs
          test -f unity/Assets/Scripts/ProductionVisualValidator.cs

          grep -q 'Attack1' unity/Assets/Scripts/FighterAnimationContract.cs
          grep -q 'Attack2' unity/Assets/Scripts/FighterAnimationContract.cs
          grep -q 'Attack3' unity/Assets/Scripts/FighterAnimationContract.cs
          grep -q 'Dodge' unity/Assets/Scripts/FighterAnimationContract.cs
          grep -q 'Hit' unity/Assets/Scripts/FighterAnimationContract.cs
          grep -q 'KO' unity/Assets/Scripts/FighterAnimationContract.cs

          if grep -Eiq 'sword|shield|axe|gun|rifle|pistol|spear|staff' unity/Assets/Editor/FighterAnimatorBuilder.cs; then
            echo 'NOTE: weapon terms are present only in the explicit rejection list; verifying no weapon fallback selection remains.'
          fi
          ! grep -Eiq 'Pick\(clips, "sword"|Pick\(clips, "shield"|Pick\(clips, "axe"|Pick\(clips, "gun"' unity/Assets/Editor/FighterAnimatorBuilder.cs

          echo 'MIRACLE production preflight passed: required character, animation and quality-gate sources are present.'

  build-android:
    name: Build Android demo
    needs: production-preflight
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Require Unity activation
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${UNITY_LICENSE:-}" ] && [ -z "${UNITY_SERIAL:-}" ]; then
            echo 'ERROR: Unity activation is not configured.'
            echo 'Add UNITY_LICENSE (recommended for Unity Personal) or UNITY_SERIAL plus UNITY_EMAIL/UNITY_PASSWORD as GitHub Actions secrets.'
            exit 1
          fi
          echo 'Unity activation material is configured.'

      # CIBuild.BuildAndroid runs the in-Editor production/animation quality gates
      # before BuildPipeline.BuildPlayer. Keeping validation in this same licensed
      # Unity session avoids a second Unity Personal activation while preserving
      # a hard failure before an APK can be published.
      - name: Unity build and production validation
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ env.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ env.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ env.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: 6000.2.6f2
          targetPlatform: Android
          buildMethod: MiracleArena.EditorTools.CIBuild.BuildAndroid
          buildName: MiracleArenaDemo
          buildsPath: build
          androidExportType: androidPackage
          versioning: Semantic

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: MiracleArena-Android
          path: build/Android
          if-no-files-found: error
