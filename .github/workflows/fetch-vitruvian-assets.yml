name: Fetch CC0 Vitruvian Character Assets

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fetch-vitruvian-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CC0 production character assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unity/Assets/ProductionCharacters/Vitruvian
          base="https://raw.githubusercontent.com/ibrews/VitruvianGodot/main"
          curl -fL "$base/godot_project/vitruvian_body.glb" -o unity/Assets/ProductionCharacters/Vitruvian/vitruvian_body.glb
          curl -fL "$base/godot_project/vitruvian_head.glb" -o unity/Assets/ProductionCharacters/Vitruvian/vitruvian_head.glb
          curl -fL "$base/godot_project/vitruvian_hair_rigged.glb" -o unity/Assets/ProductionCharacters/Vitruvian/vitruvian_hair_rigged.glb
          curl -fL "$base/LICENSE" -o unity/Assets/ProductionCharacters/Vitruvian/LICENSE.txt
          curl -fL "$base/NOTICE.md" -o unity/Assets/ProductionCharacters/Vitruvian/NOTICE.md
          printf '%s\n' \
            'Source: https://github.com/ibrews/VitruvianGodot' \
            'Character/morphs/textures: CC0 per upstream README/NOTICE.' \
            'Upstream code: MIT. Preserve NOTICE when redistributing.' \
            > unity/Assets/ProductionCharacters/Vitruvian/SOURCE.txt

      - name: Validate downloads
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            unity/Assets/ProductionCharacters/Vitruvian/vitruvian_body.glb \
            unity/Assets/ProductionCharacters/Vitruvian/vitruvian_head.glb \
            unity/Assets/ProductionCharacters/Vitruvian/vitruvian_hair_rigged.glb; do
            test -s "$f"
            bytes=$(wc -c < "$f")
            if [ "$bytes" -lt 100000 ]; then
              echo "Asset unexpectedly small: $f ($bytes bytes)" >&2
              exit 1
            fi
          done

      - name: Commit production assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unity/Assets/ProductionCharacters/Vitruvian
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Vendor CC0 Vitruvian production character assets"
          git push
