name: Deploy MIRACLE Arena Demo

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published V2 demo
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.deployment.outputs.page_url }}v2/?build=${GITHUB_SHA}"
          echo "Checking $URL"
          for i in {1..20}; do
            BODY="$(curl -fsSL -H 'Cache-Control: no-cache' "$URL" || true)"
            if echo "$BODY" | grep -q 'miracle-urban-v2-20260912b' && echo "$BODY" | grep -q 'SUNSET BLOCK'; then
              echo "PASS: live V2 page is the expected fresh build."
              exit 0
            fi
            sleep 3
          done
          echo "FAIL: GitHub Pages is not serving the expected V2 build."
          exit 1
