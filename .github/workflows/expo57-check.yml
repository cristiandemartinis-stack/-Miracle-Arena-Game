name: Expo 57 Validation

on:
  push:
    paths:
      - 'expo57/**'
      - '.github/workflows/expo57-check.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo57
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'
          cache-dependency-path: expo57/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Expo doctor
        run: npx expo-doctor

      - name: Export bundle smoke test
        run: npx expo export --platform ios --output-dir dist-ios
