name: Fetch CC0 Quaternius Combat Animations

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fetch-quaternius-animations.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-animations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CC0 animation library
        shell: bash
        run: |
          set -euo pipefail
          dir="unity/Assets/ThirdParty/Quaternius/UniversalAnimationLibrary2"
          mkdir -p "$dir"
          base="https://raw.githubusercontent.com/Barbatos6669/elderforge/main/assets/animations/universal_animation_library_2"
          curl -fL "$base/UAL2_Standard.glb" -o "$dir/UAL2_Standard.glb"
          curl -fL "$base/LICENSE_Quaternius_CC0.txt" -o "$dir/LICENSE_Quaternius_CC0.txt"
          curl -fL "$base/README.txt" -o "$dir/README_UPSTREAM.txt"
          printf '%s\n' \
            'Original author: Quaternius' \
            'Official pack: https://quaternius.com/packs/universalanimationlibrary2.html' \
            'License: CC0 1.0 Universal' \
            'Mirror used for automated retrieval: https://github.com/Barbatos6669/elderforge' \
            'Asset selected: UAL2_Standard.glb (root motion disabled)' \
            'Reason: MIRACLE Arena uses CharacterController-driven movement and explicit dodge displacement.' \
            > "$dir/SOURCE.txt"

      - name: Extract animation manifest from GLB
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import json,struct,pathlib; p=pathlib.Path('unity/Assets/ThirdParty/Quaternius/UniversalAnimationLibrary2/UAL2_Standard.glb'); data=p.read_bytes(); assert data[:4]==b'glTF'; version,total=struct.unpack_from('<II',data,4); assert version==2 and total==len(data); off=12; obj=None
          while off < len(data):
              chunk_len,chunk_type=struct.unpack_from('<II',data,off); off+=8; chunk=data[off:off+chunk_len]; off+=chunk_len
              if chunk_type==0x4E4F534A:
                  obj=json.loads(chunk.decode('utf-8').rstrip(' \\t\\r\\n\\x00')); break
          assert obj is not None; names=[a.get('name') or f'Animation_{i}' for i,a in enumerate(obj.get('animations',[]))]; p.with_name('ANIMATION_MANIFEST.txt').write_text('\\n'.join(names)+'\\n',encoding='utf-8'); print('Animations found:',len(names)); print('\\n'.join(names)); assert len(names)>=100"

      - name: Validate combat coverage
        shell: bash
        run: |
          set -euo pipefail
          f="unity/Assets/ThirdParty/Quaternius/UniversalAnimationLibrary2/ANIMATION_MANIFEST.txt"
          grep -Eiq 'attack|punch|combo|melee' "$f"
          grep -Eiq 'death|die|knock|fall' "$f"
          grep -Eiq 'hit|damage|react' "$f"
          echo "Combat animation coverage detected."

      - name: Commit animation assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unity/Assets/ThirdParty/Quaternius/UniversalAnimationLibrary2
          if git diff --cached --quiet; then
            echo "No animation changes to commit."
            exit 0
          fi
          git commit -m "Vendor CC0 Quaternius UAL2 combat animations"
          git push
