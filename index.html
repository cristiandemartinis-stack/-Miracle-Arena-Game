<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050505">
<link rel="manifest" href="manifest.webmanifest">
<title>Miracle Arena Demo</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#050505;color:white;font-family:Arial,sans-serif;touch-action:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#rotate{display:none;position:fixed;inset:0;background:#050505;z-index:99;place-items:center;text-align:center;padding:30px}
@media(orientation:portrait){#rotate{display:grid}#app{display:none}}
#app{height:100%;position:relative;background:radial-gradient(circle at 50% 35%,#30241e,#080808 65%)}
canvas{width:100%;height:100%;display:block}
#hud{position:absolute;top:12px;left:14px;right:14px;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;pointer-events:none}
.side.right{text-align:right}.name{font-size:12px;font-weight:900}.bar{height:10px;background:#292929;border:1px solid #555;margin-top:4px;overflow:hidden}.fill{height:100%;width:100%}.hp{background:linear-gradient(90deg,#8d1111,#ef4a42)}.st{background:linear-gradient(90deg,#82651d,#f0cd65)}
#timer{font-size:24px;font-weight:900;text-shadow:0 3px 12px #000}
#msg{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:clamp(36px,8vw,80px);font-weight:1000;text-shadow:0 5px 22px #000;opacity:0}
#coach{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(0,0,0,.72);border-left:3px solid #d4ab53;padding:8px 14px;font-size:13px;opacity:0}
#controls{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:space-between;align-items:end;padding:0 16px}
#joy{width:132px;height:132px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(25,25,25,.35);position:relative}
#knob{width:58px;height:58px;border-radius:50%;position:absolute;left:37px;top:37px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.55)}
.actions{width:230px;height:150px;position:relative}.btn{position:absolute;border-radius:50%;border:1px solid #666;background:rgba(17,17,17,.9);color:#fff;font-weight:900}
.btn:active{transform:scale(.94);background:#801a1a}.jab{width:74px;height:74px;right:4px;bottom:18px;border-color:#e65454}.heavy{width:62px;height:62px;right:78px;bottom:80px}.dodge{width:58px;height:58px;right:94px;bottom:4px}.guard{width:54px;height:54px;right:154px;bottom:48px}
#menu{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:18px;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.93)),radial-gradient(circle,#451d17,#050505 70%)}
.card{width:min(740px,94%);padding:24px;border:1px solid #454545;background:linear-gradient(#181818,#090909);box-shadow:0 25px 70px #000}.logo{font-size:clamp(42px,8vw,84px);font-weight:1000;line-height:.78;letter-spacing:-3px}.logo span{display:block;color:#d62e2e;font-style:italic}.tag{letter-spacing:4px;font-size:11px;color:#ddd;margin-bottom:16px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.choice,.start{border:1px solid #444;background:#151515;color:white;padding:14px;font-weight:900}.choice.active{border-color:#d62e2e;background:#281010}.start{width:100%;background:#d62e2e;border-color:#ef5555;font-size:17px}.opt{font-size:13px;margin:12px 0;color:#ddd}
</style>
</head>
<body>
<div id="rotate"><div><h2>Ruota l’iPhone</h2><p>MIRACLE ARENA si gioca in orizzontale.</p></div></div>
<div id="app">
<canvas id="game"></canvas>
<div id="hud" hidden>
 <div class="side"><div id="pname" class="name">PLAYER</div><div class="bar"><div id="php" class="fill hp"></div></div><div class="bar"><div id="pst" class="fill st"></div></div></div>
 <div id="timer">60</div>
 <div class="side right"><div class="name">THE TRIAL</div><div class="bar"><div id="ehp" class="fill hp"></div></div><div class="bar"><div id="est" class="fill st"></div></div></div>
</div>
<div id="msg"></div><div id="coach"></div>
<div id="controls" hidden>
 <div id="joy"><div id="knob"></div></div>
 <div class="actions">
  <button class="btn guard" data-a="guard">GUARDIA</button>
  <button class="btn dodge" data-a="dodge">SCHIVA</button>
  <button class="btn heavy" data-a="heavy">POTENTE</button>
  <button class="btn jab" data-a="jab">ATTACCO</button>
 </div>
</div>
<div id="menu">
 <div class="card">
  <div class="tag">THE FIGHT DEFINES YOU</div>
  <div class="logo">MIRACLE <span>ARENA</span></div>
  <p>Mini demo touch per iPhone. Scegli il Combat Style e affronta la First Trial.</p>
  <div class="choices">
   <button class="choice active" data-style="boxer">BOXER<br><small>veloce, tecnico, counter</small></button>
   <button class="choice" data-style="wrestler">WRESTLER<br><small>pressione, controllo, takedown</small></button>
  </div>
  <label class="opt"><input id="haptics" type="checkbox" checked> Vibrazioni sui colpi</label>
  <button id="start" class="start">ENTRA NELL’ARENA</button>
 </div>
</div>
</div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
const menu=document.getElementById('menu'),hud=document.getElementById('hud'),controls=document.getElementById('controls'),msg=document.getElementById('msg'),coach=document.getElementById('coach');
const php=document.getElementById('php'),pst=document.getElementById('pst'),ehp=document.getElementById('ehp'),est=document.getElementById('est'),timer=document.getElementById('timer'),pname=document.getElementById('pname');
let style='boxer',P,E,running=false,last=0,time=60,ended=false,jx=0,jy=0,guard=false,shake=0;
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));b.classList.add('active');style=b.dataset.style});
function resize(){let d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function fighter(x,y,col,player,st){return{x,y,col,player,style:st,hp:100,st:100,cd:0,atk:0,heavy:false,inv:0,down:0,face:player?1:-1,r:25}}
function flash(t,d=700){msg.textContent=t;msg.style.opacity=1;clearTimeout(flash.t);flash.t=setTimeout(()=>msg.style.opacity=0,d)}
function say(t,d=1000){coach.textContent=t;coach.style.opacity=1;clearTimeout(say.t);say.t=setTimeout(()=>coach.style.opacity=0,d)}
function buzz(){if(document.getElementById('haptics').checked&&navigator.vibrate)navigator.vibrate(18)}
function start(){menu.style.display='none';hud.hidden=false;controls.hidden=false;running=true;ended=false;time=60;P=fighter(innerWidth*.25,innerHeight*.58,'#d32d2d',true,style);E=fighter(innerWidth*.75,innerHeight*.58,'#ddd',false,'rival');pname.textContent='PLAYER · '+style.toUpperCase();last=performance.now();flash('FIRST TRIAL',900);say('Il modo in cui combatti conta.',1500);requestAnimationFrame(loop)}
document.getElementById('start').onclick=start;
const joy=document.getElementById('joy'),knob=document.getElementById('knob');
function moveJoy(e){let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy),lim=43,k=Math.min(m,lim)/(m||1);jx=dx/lim*k;jy=dy/lim*k;knob.style.transform=`translate(${dx*k}px,${dy*k}px)`}
joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);moveJoy(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))moveJoy(e)});function endJoy(){jx=jy=0;knob.style.transform='translate(0,0)'}joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);
function attack(f,h){if(f.cd||f.down||f.st<(h?22:9))return;f.heavy=h;f.atk=h?.36:.19;f.cd=h?.72:.3;f.st-=h?22:9}
function dodge(f){if(f.st<17||f.inv)return;f.st-=17;f.inv=.38;f.x-=f.face*76}
document.querySelectorAll('[data-a]').forEach(b=>{let a=b.dataset.a;b.addEventListener('pointerdown',e=>{e.preventDefault();if(a==='jab')attack(P,false);if(a==='heavy')attack(P,true);if(a==='dodge')dodge(P);if(a==='guard')guard=true});b.addEventListener('pointerup',()=>{if(a==='guard')guard=false});b.addEventListener('pointercancel',()=>{if(a==='guard')guard=false})});
function hit(a,b,h){let reach=h&&a.style==='wrestler'?88:h?66:50;if(dist(a,b)>reach+b.r||b.inv||b.down||((b.x-a.x)*a.face<-8))return;let dmg=h?(a.style==='wrestler'?25:20):(a.style==='boxer'?12:9);if(b===P&&guard){dmg*=.35;P.st-=12;say('Buona guardia.',600)}b.hp-=dmg;b.inv=.23;b.x+=a.face*(h?52:25);shake=h?10:5;buzz();if(h&&a.style==='wrestler'){b.down=.7;flash('TAKEDOWN',500)}}
function finish(t){ended=true;flash(t,1400);setTimeout(()=>{running=false;menu.style.display='grid';hud.hidden=true;controls.hidden=true},1550)}
function update(dt){if(!running||ended)return;time-=dt;if(time<=0){time=0;finish(P.hp>=E.hp?'YOU WIN':'YOU LOSE')}timer.textContent=Math.ceil(time);
 for(let q of[P,E]){q.cd=Math.max(0,q.cd-dt);q.inv=Math.max(0,q.inv-dt);q.down=Math.max(0,q.down-dt);q.st=Math.min(100,q.st+18*dt);if(q.atk>0){let before=q.atk;q.atk-=dt;if(before>.11&&q.atk<=.11)hit(q,q===P?E:P,q.heavy)}}
 if(P.down<=0&&Math.hypot(jx,jy)>.05){P.x+=jx*190*dt;P.y+=jy*130*dt;if(Math.abs(jx)>.08)P.face=Math.sign(jx)}
 if(E.down<=0){let z=dist(E,P),dir=Math.sign(P.x-E.x)||-1;E.face=dir;if(z>80){E.x+=dir*126*dt;E.y+=Math.sign(P.y-E.y)*72*dt}else if(!E.cd)attack(E,Math.random()<.3);if(Math.random()<.006)dodge(E)}
 for(let q of[P,E]){q.x=clamp(q.x,65,innerWidth-65);q.y=clamp(q.y,145,innerHeight-78)}
 php.style.width=clamp(P.hp,0,100)+'%';pst.style.width=P.st+'%';ehp.style.width=clamp(E.hp,0,100)+'%';est.style.width=E.st+'%';
 if(P.hp<=0||E.hp<=0)finish(P.hp>E.hp?'YOU WIN':'YOU LOSE')}
function drawF(q){ctx.save();ctx.translate(q.x,q.y);if(q.down)ctx.rotate(1.2);ctx.globalAlpha=q.inv&&Math.floor(q.inv*24)%2?.45:1;ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(0,30,37,12,0,0,7);ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-10,17);ctx.lineTo(-15,48);ctx.moveTo(10,17);ctx.lineTo(15,48);ctx.stroke();ctx.fillStyle=q.col;ctx.beginPath();ctx.roundRect(-21,-29,42,49,9);ctx.fill();ctx.fillStyle='#b77952';ctx.beginPath();ctx.arc(0,-44,14,0,7);ctx.fill();let r=q.atk?37:19;ctx.strokeStyle=q.col;ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(-14,-11);ctx.lineTo(-q.face*4,-2);ctx.moveTo(14,-11);ctx.lineTo(q.face*r,-9);ctx.stroke();ctx.fillStyle=q.player?'#111':'#8d1010';ctx.beginPath();ctx.arc(q.face*r,-9,7,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillText(q.style==='wrestler'?'W':'B',0,3);ctx.restore()}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);let sx=shake?(Math.random()-.5)*shake:0,sy=shake?(Math.random()-.5)*shake:0;shake*=.82;ctx.save();ctx.translate(sx,sy);let g=ctx.createLinearGradient(0,0,0,innerHeight);g.addColorStop(0,'#1d1714');g.addColorStop(1,'#050505');ctx.fillStyle=g;ctx.fillRect(0,0,innerWidth,innerHeight);for(let i=0;i<10;i++){ctx.fillStyle='rgba(255,220,170,.08)';ctx.beginPath();ctx.arc((i+.5)*innerWidth/10,35,15,0,7);ctx.fill()}for(let i=0;i<45;i++){ctx.fillStyle=i%3?'#171717':'#232323';ctx.beginPath();ctx.arc((i*79)%innerWidth,105+(i%4)*16,8,0,7);ctx.fill()}ctx.fillStyle='#1e1e1e';ctx.beginPath();ctx.ellipse(innerWidth/2,innerHeight*.65,innerWidth*.43,innerHeight*.3,0,0,7);ctx.fill();ctx.strokeStyle='#555';ctx.lineWidth=4;ctx.stroke();ctx.fillStyle='rgba(211,41,41,.12)';ctx.font='900 46px Arial';ctx.textAlign='center';ctx.fillText('MIRACLE ARENA',innerWidth/2,innerHeight*.69);drawF(P);drawF(E);ctx.restore()}
function loop(t){let dt=Math.min((t-last)/1000,.033);last=t;update(dt);draw();if(running)requestAnimationFrame(loop)}
if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});
</script>
</body></html>
